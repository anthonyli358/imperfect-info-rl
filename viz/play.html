<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play the Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Tokens from the Ladder design system (https://claude.ai/artifact/TjrPnNNCcB8fDiSHoFn4c5). */
  :root {
    --ground: #f0f2f6; --surface: #ffffff; --surface-2: #f6f7fa; --ink: #1b2230; --muted: #5c6678;
    --faint: #8b93a4; --line: #e1e5ee; --accent: #4f6aa8; --accent-soft: #e7ecf7;
    --shadow-raised: 0 1px 2px rgba(20, 28, 46, .06), 0 8px 24px rgba(20, 28, 46, .06);
    --pos: #2f7d55; --neg: #b8414c; --on-accent: #ffffff; color-scheme: light;
    /* Theme-independent: piece labels and the face-down back (piece colours come from the game's meta). */
    --piece-ink: #1b2230; --piece-paper: #ffffff; --back-a: #5c6678; --back-b: #6b7688;
    --font-display: "Archivo", system-ui, sans-serif; --font-body: "Hanken Grotesk", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --space-3: 3px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-10: 10px; --space-12: 12px;
    --space-14: 14px; --space-16: 16px; --space-22: 22px;
    --radius-5: 5px; --radius-7: 7px; --radius-8: 8px; --radius-9: 9px; --radius-10: 10px; --radius-12: 12px;
    --radius-16: 16px; --radius-pill: 999px; --radius-round: 50%;
    --page-max: 1180px; --log-column: 280px; --stage-min: 420px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f131b; --surface: #191e29; --surface-2: #131822; --ink: #e9edf4; --muted: #97a1b3;
      --faint: #6b7688; --line: #29303d; --accent: #8099c8; --accent-soft: #232c3d;
      --shadow-raised: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
      --pos: #57b483; --neg: #e06b76; --on-accent: #0f131b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f131b; --surface: #191e29; --surface-2: #131822; --ink: #e9edf4; --muted: #97a1b3;
    --faint: #6b7688; --line: #29303d; --accent: #8099c8; --accent-soft: #232c3d;
    --shadow-raised: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    --pos: #57b483; --neg: #e06b76; --on-accent: #0f131b; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button { font: inherit; }

  .wrap { max-width: var(--page-max); margin: 0 auto; padding: var(--space-22) var(--space-16) 40px; display: flex; flex-direction: column; gap: var(--space-16); }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 20px; }
  .eyebrow { font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.02em; line-height: .95; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .spacer { flex: 1; }
  .controls { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: center; }
  select { font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-8); padding: 7px 8px; max-width: 100%; }
  .btn { font-family: var(--font-display); font-weight: 600; font-size: 13px; border-radius: var(--radius-9); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .record { font-size: 12px; color: var(--muted); }
  .record b { color: var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) var(--log-column); gap: var(--space-16); align-items: start; }
  .stage { background: radial-gradient(120% 90% at 50% 42%, color-mix(in srgb, var(--accent) 5%, var(--surface)), var(--surface)); border: 1px solid var(--line); border-radius: var(--radius-16); box-shadow: var(--shadow-raised); padding: var(--space-16); display: flex; flex-direction: column; gap: var(--space-12); min-height: var(--stage-min); }

  .panel { border-radius: var(--radius-12); padding: var(--space-12) var(--space-14); border: 1px solid transparent; }
  .panel.active { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .panel-head { display: flex; align-items: center; gap: var(--space-10); margin-bottom: var(--space-10); flex-wrap: wrap; }
  .pname { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
  .kind { font-size: 11px; color: var(--faint); }
  .pscore { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 17px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }

  .hand { display: flex; flex-wrap: wrap; gap: var(--space-6); margin-top: var(--space-10); align-items: flex-end; }
  .hand-note { font-size: 11px; color: var(--muted); margin-top: var(--space-6); }

  /* Pieces (GoodCard): --c is the piece colour; the label is piece-paper, or piece-ink with .on-light
     (chosen by contrast in pieceClass). A .no-small piece reaches 4.5:1 with neither: no small text on it. */
  .gcard { --c: var(--muted); --label: var(--piece-paper); position: relative; width: 58px; height: 80px; border-radius: var(--radius-9); flex: none;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 88%, #fff), var(--c));
    border: 1px solid color-mix(in srgb, var(--c) 70%, #000); color: var(--label); box-shadow: var(--shadow-raised);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .gcard.on-light, .strip.on-light, .coin.top.on-light { --label: var(--piece-ink); }
  .gcard.edge { border-color: var(--line); }
  .gcard .sym { font-size: 24px; line-height: 1; }
  .gcard .nm { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .gcard.no-small .nm { display: none; }
  .gcard.known { outline: 2px dashed var(--c); outline-offset: 2px; }
  .gcard.back { --c: var(--back-b); background: repeating-linear-gradient(45deg, var(--back-a), var(--back-a) 6px, var(--back-b) 6px, var(--back-b) 12px); }
  .gcard.small { width: 44px; height: 60px; } .gcard.small .sym { font-size: 18px; } .gcard.small .nm { font-size: 8px; }
  .vcard .rank { font-family: var(--font-mono); font-size: 26px; font-weight: 700; line-height: 1; }
  .vcard .corner { position: absolute; top: 4px; left: 6px; font-size: 12px; }
  .vcard.small .rank { font-size: 19px; } .vcard.small .nm { display: none; }
  .gcard.hand { cursor: pointer; transition: transform .12s; }
  .gcard.hand.inert { cursor: default; }
  .gcard.hand.playable::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: var(--radius-round); background: var(--piece-paper); box-shadow: 0 0 0 2px var(--pos); }
  .gcard.hand.selected { transform: translateY(-8px); outline: 3px solid var(--accent); outline-offset: 2px; }
  .gcard.hand:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .gcard.hand { transition: none; } .gcard.hand.selected { transform: none; } }
  button.gcard { font: inherit; cursor: pointer; padding: 0; }
  .deckcard .sym { font-family: var(--font-mono); font-size: 20px; }

  /* Table: route columns (RouteColumn), the deck and discard piles (Pile) */
  .center { display: flex; align-items: stretch; gap: var(--space-10); padding: var(--space-4); flex-wrap: wrap; }
  .discards { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-8); flex: 1; }
  .pile { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); border: 0; background: transparent; padding: 0; color: inherit; min-width: 0; }
  .pile .cap { font-size: 9px; color: var(--faint); text-transform: uppercase; }
  .target { cursor: pointer; outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: var(--radius-10); }
  .target:hover { background: var(--accent-soft); }
  .target:focus-visible { outline-color: var(--accent); }
  .center .pile.target { padding: var(--space-3); }
  .slot-empty { width: 44px; height: 60px; border-radius: var(--radius-9); border: 1px dashed var(--line); display: grid; place-items: center; font-size: 18px; opacity: .5; }
  .tableau { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-8); }
  .route { --c: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: var(--radius-9); padding: 6px 5px 5px; display: flex; flex-direction: column; gap: var(--space-4); min-height: 58px; min-width: 0; }
  .route.hl { outline: 2px dashed var(--c); outline-offset: 1px; }
  .route-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
  .route-name { font-size: 10px; font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .route-score { font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .strip { --label: var(--piece-paper); height: 22px; border-radius: var(--radius-5); background: var(--c); color: var(--label); display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
    font-family: var(--font-mono); font-weight: 700; font-size: 12px; border: 1px solid color-mix(in srgb, var(--c) 70%, #000); }
  .route-empty { font-size: 20px; opacity: .25; text-align: center; padding-top: 6px; }

  /* Camel Stocks: tokens (TokenPile), herd (Herd), market and moves (Zone, MoveGroup) */
  .coins { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: 5px; }
  .coin { width: 22px; height: 22px; border-radius: var(--radius-round); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    background: color-mix(in srgb, var(--c) 22%, var(--surface)); color: color-mix(in srgb, var(--c) 45%, var(--ink)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); }
  .coin.top { --label: var(--piece-paper); width: 28px; height: 28px; font-size: 13px; background: var(--c); color: var(--label); border-color: color-mix(in srgb, var(--c) 70%, #000); }
  .zone { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-12); padding: var(--space-10) var(--space-12); }
  .zone-title { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: var(--space-8); display: flex; gap: var(--space-10); align-items: baseline; }
  .zone-title b { color: var(--ink); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .row { display: flex; gap: var(--space-8); flex-wrap: wrap; align-items: center; }
  .herd { display: flex; align-items: center; gap: var(--space-6); }
  .herd .gcard { width: 40px; height: 54px; } .herd .gcard .sym { font-size: 18px; } .herd .gcard .nm { display: none; }
  .herd .n { font-family: var(--font-mono); font-weight: 700; }
  .tokens { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-8); }
  .tpile { background: var(--surface-2); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: var(--radius-9); padding: var(--space-6); min-width: 0; }
  .tpile .name { font-size: 10px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tpile .vals { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .tpile .vals b { color: var(--ink); font-size: 13px; }
  .tpile.empty { opacity: .45; }
  .chips { display: flex; gap: var(--space-6); flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 10px; background: var(--surface-2); }
  .chip b { color: var(--ink); }
  .moves { display: flex; flex-direction: column; gap: var(--space-8); }
  .move-group { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: center; }
  .move-group .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); min-width: 70px; }

  /* Tessera (Ladder design system: Tile, Factory, Wall) */
  :root { --tile: 30px; }
  @media (max-width: 560px) { :root { --tile: 22px; } .tile { font-size: 11px; } .tboard { gap: 8px; } }
  .tile { --c: var(--muted); --label: var(--piece-paper); width: var(--tile); height: var(--tile); border-radius: var(--radius-5); background: var(--c); color: var(--label);
    border: 1px solid color-mix(in srgb, var(--c) 70%, var(--line)); display: grid; place-items: center; font-size: 14px; line-height: 1; flex: none; padding: 0;
    box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 35%, transparent); font-family: inherit; }
  .tile.on-light { --label: var(--piece-ink); }
  .tile.edge { border-color: var(--line); }
  .tile.ghost { background: color-mix(in srgb, var(--c) 16%, var(--surface-2)); color: color-mix(in srgb, var(--c) 60%, var(--muted)); border-style: dashed; box-shadow: none; }
  .tile.slot { background: transparent; border: 1px dashed var(--line); color: transparent; box-shadow: none; }
  .tile.marker { --c: var(--surface); --label: var(--ink); font-family: var(--font-mono); font-weight: 700; border-color: var(--line); }
  button.tile { cursor: pointer; }
  button.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile.picked { outline: 3px solid var(--accent); outline-offset: 2px; transform: translateY(-3px); transition: transform .12s; }
  @media (prefers-reduced-motion: reduce) { .tile.picked { transition: none; transform: none; } }
  .factories { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .factory { display: grid; grid-template-columns: repeat(2, var(--tile)); gap: 3px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); width: calc(2 * var(--tile) + 22px); height: calc(2 * var(--tile) + 22px); place-content: center; }
  .factory.empty { opacity: .45; }
  .pool { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 30px; }
  .tboard { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .tlines, .twall { display: grid; gap: 3px; }
  .tlines { justify-items: end; }
  .tline { display: flex; justify-content: flex-end; gap: 3px; border-radius: 7px; padding: 1px; border: 0; background: transparent; }
  .twall { grid-template-columns: repeat(5, var(--tile)); }
  .tfloor { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 8px; align-items: flex-start; border: 0; background: transparent; padding: 1px; border-radius: 7px; }
  .tfloor .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tfloor .pen { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--neg); }
  .tline.target, .tfloor.target { cursor: pointer; }
  .prompt { text-align: center; font-size: 13px; color: var(--muted); min-height: 36px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .prompt b { color: var(--ink); }
  .error { color: var(--neg); font-size: 12px; text-align: center; min-height: 16px; }

  .banner { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-raised); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .banner .big { font-family: var(--font-display); font-weight: 800; font-size: 20px; }

  .log { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-raised); overflow: hidden; display: flex; flex-direction: column; max-height: 620px; }
  .log h2 { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .log-list { overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .log-list .you { color: var(--ink); } .log-list .opp { color: var(--muted); } .log-list .chance { color: var(--faint); font-style: italic; }
  .log-list .you::before { content: "● "; color: var(--accent); } .log-list .opp::before { content: "○ "; color: var(--faint); }
  .empty { color: var(--muted); text-align: center; padding: 60px 10px; }
  footer { color: var(--faint); font-size: 11px; line-height: 1.5; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .controls { min-width: 0; max-width: 100%; }
    .controls select { min-width: 0; max-width: 100%; }
    .log { max-height: 260px; }
    .tableau, .discards, .tokens { gap: 4px; }
    .tokens { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .route-name { font-size: 8px; }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Human vs agent</p>
      <h1 id="title">Play the agents</h1>
      <div class="sub" id="sub">Pick a game and an opponent, then start.</div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <select id="game" aria-label="Game"></select>
      <select id="agent" aria-label="Opponent"></select>
      <select id="seat" aria-label="Seat">
        <option value="random">Random seat</option>
        <option value="0">You go first</option>
        <option value="1">You go second</option>
      </select>
      <button class="btn primary" id="new">New game</button>
    </div>
  </header>
  <div class="record" id="record"></div>

  <div class="layout">
    <section class="stage" id="stage" aria-label="Game board"><div class="empty">No game yet.</div></section>
    <aside class="log" aria-label="Move log"><h2>Moves</h2><div class="log-list" id="log"></div></aside>
  </div>

  <footer id="rules"></footer>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var games = {}, state = null, selected = null, busy = false;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function signed(v) { return (v > 0 ? "+" : "") + v; }
  function sign(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
  function legalIds() { return (state.legal || []).map(function (a) { return a.id; }); }
  function banner() {
    if (!state.terminal) return "";
    var m = state.margin;
    return '<div class="banner"><span class="big ' + sign(m) + '">' + (m > 0 ? "You win" : m < 0 ? "You lose" : "Draw") +
      '</span><span class="mono">by ' + Math.abs(m) + '</span><button class="btn primary" data-act="again">Play again</button></div>';
  }
  function prompt(text) { return '<div class="prompt">' + text + '</div><div class="error">' + esc(state.error || "") + "</div>"; }
  function lum(hex) {
    var c = [1, 3, 5].map(function (i) {
      var v = parseInt(hex.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  var INK_LUM = lum("#1b2230");  // piece-ink; piece-paper is white (luminance 1)
  function pieceClass(hex) {
    // The design system's label rule: print in whichever of piece-ink and piece-paper contrasts more
    // (" on-light" for ink); a piece where neither reaches 4.5:1 is " no-small" (numerals and glyphs only).
    var L = lum(hex), paper = 1.05 / (L + 0.05), ink = (L + 0.05) / (INK_LUM + 0.05);
    return (ink > paper ? " on-light" : "") + (Math.max(ink, paper) < 4.5 ? " no-small" : "");
  }

  // ======================= Ventures =======================
  var V = {
    rules: "Each turn: play a card onto one of your routes (ascending, backing cards first) or discard it, then draw from the deck or take the top of a discard pile (not the one you just discarded to). A started route scores (sum − 20) × (1 + backing cards), +20 with 8 or more cards. The game ends when the deck runs out. A green dot marks cards you can play; outlined opponent cards are ones they took from a discard pile.",
    decode: function (meta, id) { var n = meta.ranks.length, r = meta.ranks[id % n]; return { suit: Math.floor(id / n), rank: r, backing: r === meta.ranks[0] }; },
    name: function (meta, id) { var d = V.decode(meta, id); return meta.suit_names[d.suit] + " " + (d.backing ? "backing" : d.rank); },
    card: function (meta, id, cls, attrs) {
      // A full-colour card: the rank large (a backing card shows ×), the venture's symbol in the corner.
      var d = V.decode(meta, id), hex = meta.suit_colors[d.suit];
      return '<div class="gcard vcard ' + cls + pieceClass(hex) + '" style="--c:' + hex + '" ' + (attrs || "") + ' title="' + esc(V.name(meta, id)) + '">' +
        '<span class="corner">' + meta.suit_symbols[d.suit] + '</span><span class="rank">' + (d.backing ? "×" : d.rank) + '</span>' +
        '<span class="nm">' + (d.backing ? "backing" : esc(meta.suit_names[d.suit])) + "</span></div>";
    },
    strip: function (meta, id) {
      var d = V.decode(meta, id);
      var hex = meta.suit_colors[d.suit];
      return '<div class="strip' + pieceClass(hex) + '" style="--c:' + hex + '" title="' + esc(V.name(meta, id)) + '"><span>' + (d.backing ? "×" : d.rank) +
        "</span><span>" + meta.suit_symbols[d.suit] + "</span></div>";
    },
    routeScore: function (meta, cards) {
      if (!cards.length) return null;
      var b = 0, s = 0;
      cards.forEach(function (id) { var d = V.decode(meta, id); if (d.backing) b++; else s += d.rank; });
      return (s - meta.start_cost) * (1 + b) + (cards.length >= 8 ? 20 : 0);
    },
    tableau: function (meta, routes, highlight) {
      return '<div class="tableau">' + routes.map(function (cards, s) {
        var sc = V.routeScore(meta, cards);
        var body = cards.length ? cards.map(function (id) { return V.strip(meta, id); }).join("")
          : '<div class="route-empty" style="color:' + meta.suit_colors[s] + '">' + meta.suit_symbols[s] + "</div>";
        return '<div class="route' + (highlight === s ? " hl" : "") + '" style="--c:' + meta.suit_colors[s] + '"><div class="route-head"><span class="route-name">' +
          meta.suit_symbols[s] + " " + esc(meta.suit_names[s]) + "</span>" +
          (sc === null ? "" : '<span class="route-score ' + sign(sc) + '">' + signed(sc) + "</span>") +
          '</div><div class="stack">' + body + "</div></div>";
      }).join("") + "</div>";
    },
    render: function () {
      var meta = state.meta, v = state.view, A = meta.actions, me = state.seat, opp = 1 - me;
      var ids = legalIds(), play = [], discard = [], deck = false, take = [];
      ids.forEach(function (a) {
        if (a < A.discard_offset) play.push(a);
        else if (a < A.draw_deck) discard.push(a - A.discard_offset);
        else if (a === A.draw_deck) deck = true;
        else take.push(a - A.take_offset);
      });
      var playPhase = state.your_turn && v.phase === "PLAY", drawPhase = state.your_turn && v.phase === "DRAW";
      var hidden = (v.hidden || [0, 0])[opp];
      var oppCards = v.hands[opp].slice().sort(function (a, b) { return a - b; })
        .map(function (id) { return V.card(meta, id, "small" + (state.terminal ? "" : " known")); }).join("") +
        new Array(hidden + 1).join('<div class="gcard back small"><span class="sym">?</span></div>');
      var oppPanel = '<div class="panel' + (!state.terminal && !state.your_turn ? " active" : "") + '"><div class="panel-head"><span class="pname">Opponent</span><span class="kind">' + esc(state.agent) +
        '</span><span class="pscore ' + sign(v.scores[opp]) + '">' + signed(v.scores[opp]) + ' <span class="kind">pts</span></span></div>' +
        '<div class="hand" style="margin:0 0 10px">' + oppCards + "</div>" + V.tableau(meta, v.routes[opp]) +
        (state.terminal ? '<div class="hand-note">Their hand, revealed.</div>' : "") + "</div>";
      var deckHtml = '<div class="pile">' + (drawPhase && deck
        ? '<button class="gcard back deckcard target" data-act="' + A.draw_deck + '" aria-label="Draw from the deck"><span class="sym">' + v.deck_size + "</span><span class=\"nm\">draw</span></button>"
        : '<div class="gcard back deckcard"><span class="sym">' + v.deck_size + '</span><span class="nm">deck</span></div>') + '<span class="cap">' + v.deck_size + " left</span></div>";
      var piles = v.discards.map(function (pile, s) {
        var top = pile.length ? V.card(meta, pile[pile.length - 1], "small")
          : '<div class="slot-empty" style="color:' + meta.suit_colors[s] + '">' + meta.suit_symbols[s] + "</div>";
        var can = drawPhase && take.indexOf(s) >= 0;
        return (can ? '<button class="pile target" data-act="' + (A.take_offset + s) + '" aria-label="Take the ' + esc(meta.suit_names[s]) + ' discard">' : '<div class="pile">') +
          top + '<span class="cap">' + (pile.length ? pile.length + " discarded" : "empty") + "</span>" + (can ? "</button>" : "</div>");
      }).join("");
      var p, highlight = -1;
      if (state.terminal) p = "";
      else if (!state.your_turn) p = "Opponent is thinking…";
      else if (playPhase && selected === null) p = "<b>Your turn:</b> pick a card from your hand.";
      else if (playPhase) {
        var d = V.decode(meta, selected), canPlay = play.indexOf(selected) >= 0, route = v.routes[me][d.suit];
        highlight = canPlay ? d.suit : -1;
        var now = V.routeScore(meta, route), next = V.routeScore(meta, route.concat([selected]));
        var preview = canPlay ? ' <span class="kind">' + esc(meta.suit_names[d.suit]) + " route: " + (now === null ? "not started" : signed(now)) +
          " → <b class=\"" + sign(next) + "\">" + signed(next) + "</b></span>" : ' <span class="kind">cannot be played (routes ascend; backing cards go first)</span>';
        p = "<b>" + esc(V.name(meta, selected)) + "</b>" + preview +
          '<button class="btn primary" data-act="' + selected + '"' + (canPlay ? "" : " disabled") + ">Play to route</button>" +
          '<button class="btn" data-act="' + (A.discard_offset + selected) + '">Discard</button><button class="btn" data-act="cancel">Cancel</button>';
      } else p = "<b>Draw:</b> click the deck or a highlighted discard pile.";
      var hand = v.hands[me].slice().sort(function (a, b) { return a - b; }).map(function (id) {
        var cls = "hand" + (playPhase && play.indexOf(id) >= 0 ? " playable" : "") + (playPhase && id === selected ? " selected" : "") + (playPhase ? "" : " inert");
        return V.card(meta, id, cls, playPhase ? 'tabindex="0" role="button" data-card="' + id + '"' : "");
      }).join("");
      var you = '<div class="panel' + (state.your_turn ? " active" : "") + '"><div class="panel-head"><span class="pname">You</span><span class="kind">P' + me +
        '</span><span class="pscore ' + sign(v.scores[me]) + '">' + signed(v.scores[me]) + ' <span class="kind">pts</span></span></div>' + V.tableau(meta, v.routes[me], highlight) +
        '<div class="hand">' + hand + "</div></div>";
      return banner() + oppPanel + '<div class="center">' + deckHtml + '<div class="discards">' + piles + "</div></div>" + prompt(p) + you;
    }
  };

  // ======================= Camel Stocks =======================
  var C = {
    rules: "Each turn, do one thing: take one good from the market (hand limit 7), take all the camels, exchange 2+ goods from the market for as many cards and/or camels (never giving back a good you take), or sell cards of one good (gems, gold, silver: at least 2) for its top tokens, with a bonus for 3, 4 or 5+ cards. The game ends when three token piles are empty or the deck cannot refill the market. The larger herd scores +5. Outlined opponent cards are goods they were seen taking.",
    card: function (meta, id, cls) {
      return '<div class="gcard ' + (cls || "") + pieceClass(meta.card_colors[id]) + '" style="--c:' + meta.card_colors[id] + '" title="' + esc(meta.card_names[id]) + '">' +
        '<span class="sym">' + meta.card_symbols[id] + '</span><span class="nm">' + esc(meta.card_names[id]) + "</span></div>";
    },
    goodOf: function (meta, label) {
      // The good a move label is about (for colouring its button), or -1.
      for (var g = meta.card_names.length - 1; g >= 0; g--) {
        if (label.toLowerCase().indexOf(meta.card_names[g].toLowerCase()) >= 0) return g;
      }
      return /camel/.test(label) ? meta.card_names.length - 1 : -1;
    },
    render: function () {
      var meta = state.meta, v = state.view, me = state.seat, opp = 1 - me;
      var names = meta.card_names, camel = names.length - 1;
      var byGood = function (a, b) { return a - b; };
      var tokens = '<div class="zone"><div class="zone-title">Goods tokens <b>next sale takes the big coin first</b></div><div class="tokens">' +
        v.tokens.map(function (pile, g) {
          var coins = pile.map(function (t, i) { return '<span class="coin' + (i === 0 ? " top" + pieceClass(meta.card_colors[g]) : "") + '">' + t + "</span>"; }).join("");
          return '<div class="tpile' + (pile.length ? "" : " empty") + '" style="--c:' + meta.card_colors[g] + '"><div class="name">' +
            meta.card_symbols[g] + " " + esc(names[g]) + (meta.precious.indexOf(g) >= 0 ? " ×2+" : "") +
            '</div><div class="coins">' + (coins || '<span class="vals">sold out</span>') + "</div></div>";
        }).join("") + '</div><div class="chips" style="margin-top:8px"><span class="chip">bonus tokens left for 3 / 4 / 5+ cards: <b>' + v.bonus_left.join(" / ") +
        '</b></span><span class="chip">larger herd: <b>+5</b></span></div></div>';
      var market = '<div class="zone"><div class="zone-title">Market <b>' + v.deck_size + " cards left in the deck</b></div>" +
        '<div class="row">' + v.market.slice().sort(byGood).map(function (c) { return C.card(meta, c); }).join("") + "</div></div>";
      function panel(p, who) {
        var hidden = (v.hidden || [0, 0])[p];
        var cards = v.hands[p].slice().sort(byGood).map(function (c) { return C.card(meta, c, p === opp && !state.terminal ? "known" : ""); }).join("") +
          new Array(hidden + 1).join('<div class="gcard back"><span class="sym">?</span></div>');
        var size = v.hands[p].length + hidden;
        var active = !state.terminal && (p === me ? state.your_turn : !state.your_turn);
        var herd = '<div class="herd">' + C.card(meta, camel, "small") + '<span class="n">× ' + v.herds[p] + "</span></div>";
        return '<div class="panel' + (active ? " active" : "") + '"><div class="panel-head"><span class="pname">' + who + "</span>" +
          '<span class="kind">' + (p === opp ? esc(state.agent) : "P" + me) + '</span><span class="chip">hand <b>' + size + "/" + meta.hand_limit + "</b></span>" +
          '<span class="pscore">' + v.scores[p] + ' <span class="kind">pts</span></span></div>' +
          '<div class="row" style="justify-content:space-between;align-items:flex-end"><div class="hand" style="margin-top:0">' + cards + "</div>" + herd + "</div></div>";
      }
      var exch = (v.taken && v.taken.length) || (v.given && v.given.length)
        ? '<div class="zone"><div class="zone-title">Exchange in progress</div><div class="row"><span class="kind">taking</span>' +
          v.taken.map(function (c) { return C.card(meta, c, "small"); }).join("") + '<span class="kind" style="margin-left:12px">giving</span>' +
          (v.given.map(function (c) { return C.card(meta, c, "small"); }).join("") || '<span class="kind">—</span>') + "</div></div>" : "";
      var moves = "";
      if (state.your_turn) {
        var groups = {};
        state.legal.forEach(function (a) {
          var key = /^exchange/.test(a.label) ? "Exchange" : /^sell/.test(a.label) ? "Sell" : "Take";
          (groups[key] = groups[key] || []).push(a);
        });
        moves = '<div class="moves">' + ["Take", "Sell", "Exchange"].filter(function (k) { return groups[k]; }).map(function (k) {
          return '<div class="move-group"><span class="glabel">' + k + "</span>" + groups[k].map(function (a) {
            // Buttons stay interface-coloured (piece colours belong to pieces); the good's glyph names it.
            var g = C.goodOf(meta, a.label);
            return '<button class="btn" data-act="' + a.id + '">' + (g >= 0 ? meta.card_symbols[g] + " " : "") +
              esc(a.label.replace(/^exchange: /, "")) + "</button>";
          }).join("") + "</div>";
        }).join("") + "</div>";
      }
      var p = state.terminal ? "" : state.your_turn ? "<b>Your turn:</b> choose a move below." : "Opponent is thinking…";
      return banner() + panel(opp, "Opponent") + tokens + market + exch + prompt(p) + moves + panel(me, "You");
    }
  };

  // ======================= Tessera =======================
  var T = {
    rules: "Each turn take every tile of one colour from one display (its other tiles slide to the centre) or from the centre (the first to do so also takes the first-player marker, which fills a floor space). Put them on one pattern row (one colour per row, and not a colour that row already has on the wall) or on the floor; tiles that do not fit fall to the floor. When the displays and centre are empty, each full row moves one tile to the wall and scores 1, or the length of the rows and columns it joins; floor tiles cost the points under them. The game ends after the round in which someone completes a wall row: +2 per full row, +7 per full column, +10 per colour placed five times.",
    tile: function (meta, k, cls, attrs, tag) {
      // Label colour by the design system's rule (pieceClass); a tile close to either ground keeps its border.
      var hex = meta.color_hex[k], L = lum(hex);
      var extra = pieceClass(hex) + (L < 0.04 || L > 0.6 ? " edge" : "");
      tag = tag || "div";
      return "<" + tag + ' class="tile' + extra + (cls ? " " + cls : "") + '" style="--c:' + hex + '" title="' + esc(meta.color_names[k]) + '" ' +
        (attrs || "") + ">" + meta.color_symbols[k] + "</" + tag + ">";
    },
    slot: '<div class="tile slot"></div>',
    source: function (meta, tiles, src, canPick) {
      // A display's or the centre's tiles; a colour you may take is a button (key = source × colours + colour).
      var NC = meta.actions.num_colors, out = "";
      tiles.forEach(function (n, k) {
        var key = src * NC + k;
        for (var i = 0; i < n; i++) {
          out += canPick(key)
            ? T.tile(meta, k, selected === key ? "picked" : "", 'data-card="' + key + '" aria-label="Take ' + n + " " + esc(meta.color_names[k]) + '"', "button")
            : T.tile(meta, k, "");
        }
      });
      return out;
    },
    board: function (meta, b, targets) {
      // Pattern rows (filled from the right) beside the wall (empty spaces show their printed colour), the floor below.
      var W = meta.wall_size, A = meta.actions;
      var lines = b.lines.map(function (line, r) {
        var k = line[0], n = line[1], cells = "";
        for (var i = 0; i < r + 1; i++) cells += i >= r + 1 - n ? T.tile(meta, k, "") : T.slot;
        var act = targets[r];
        return act !== undefined
          ? '<button class="tline target" data-act="' + act + '" aria-label="Place on row ' + (r + 1) + '">' + cells + "</button>"
          : '<div class="tline">' + cells + "</div>";
      }).join("");
      var wall = "";
      for (var r = 0; r < W; r++) {
        for (var c = 0; c < W; c++) wall += T.tile(meta, ((c - r) % W + W) % W, b.wall[r][c] ? "" : "ghost");
      }
      var pens = meta.floor_penalties;
      var floor = pens.map(function (pen, i) {
        return '<div class="cell">' + (i < b.floor ? '<div class="tile marker">•</div>' : T.slot) + '<span class="pen">' + pen + "</span></div>";
      }).join("") + (b.floor > pens.length ? '<span class="kind">+' + (b.floor - pens.length) + " free</span>" : "");
      var fact = targets[A.floor];
      floor = fact !== undefined
        ? '<button class="tfloor target" data-act="' + fact + '" aria-label="Place on the floor">' + floor + "</button>"
        : '<div class="tfloor">' + floor + "</div>";
      return '<div class="tboard"><div class="tlines">' + lines + '</div><div class="twall">' + wall + "</div></div>" + floor;
    },
    render: function () {
      var meta = state.meta, v = state.view, A = meta.actions, me = state.seat, opp = 1 - me;
      var ND = A.num_destinations, NC = A.num_colors, picks = {};
      legalIds().forEach(function (a) {
        var key = Math.floor(a / ND);
        (picks[key] = picks[key] || {})[a % ND] = a;
      });
      var myTurn = state.your_turn && !state.terminal;
      if (selected !== null && !picks[selected]) selected = null;
      var canPick = function (key) { return myTurn && picks[key] !== undefined; };
      var factories = v.factories.map(function (f, i) {
        var has = f.some(function (n) { return n > 0; });
        return '<div class="factory' + (has ? "" : " empty") + '" title="Display ' + (i + 1) + '">' + T.source(meta, f, i, canPick) + "</div>";
      }).join("");
      var pool = T.source(meta, v.center, A.center, canPick) + (v.marker_in_center ? '<div class="tile marker" title="First-player marker">1</div>' : "");
      var centre = '<div class="zone"><div class="zone-title">Displays <b>round ' + v.round + '</b></div><div class="factories">' + factories + "</div>" +
        '<div class="zone-title" style="margin-top:10px">Centre</div><div class="pool">' + (pool || '<span class="kind">empty</span>') + "</div>" +
        '<div class="chips" style="margin-top:8px"><span class="chip">in the bag <b>' + v.bag + '</b></span><span class="chip">in the lid <b>' + v.lid + "</b></span></div></div>";
      var targets = selected !== null && myTurn ? picks[selected] : {};
      function panel(p, who, kind) {
        var b = v.boards[p], active = !state.terminal && (p === me ? state.your_turn : !state.your_turn);
        return '<div class="panel' + (active ? " active" : "") + '"><div class="panel-head"><span class="pname">' + who + '</span><span class="kind">' + kind +
          '</span><span class="pscore">' + b.score + ' <span class="kind">pts</span></span></div>' + T.board(meta, b, p === me ? targets : {}) + "</div>";
      }
      var p;
      if (state.terminal) p = "";
      else if (!state.your_turn) p = "Opponent is thinking…";
      else if (selected === null) p = "<b>Your turn:</b> pick a colour from a display or the centre.";
      else {
        var src = Math.floor(selected / NC), k = selected % NC;
        var n = (src === A.center ? v.center : v.factories[src])[k];
        p = "<b>" + n + " " + esc(meta.color_names[k]) + "</b> from " + (src === A.center ? "the centre" : "display " + (src + 1)) +
          ': click a highlighted row or the floor. <button class="btn" data-act="cancel">Cancel</button>';
      }
      return banner() + panel(opp, "Opponent", esc(state.agent)) + centre + prompt(p) + panel(me, "You", "P" + me);
    }
  };

  // ======================= Any other game: the raw view and the legal moves =======================
  var G = {
    rules: "No board for this game yet: the panel shows your view of the position, and every legal move is a button.",
    render: function () {
      var moves = state.your_turn ? '<div class="move-group">' + state.legal.map(function (a) {
        return '<button class="btn" data-act="' + a.id + '">' + esc(a.label) + "</button>";
      }).join("") + "</div>" : "";
      var p = state.terminal ? "" : state.your_turn ? "<b>Your turn:</b> choose a move." : "Opponent is thinking…";
      return banner() + '<pre class="mono" style="white-space:pre-wrap;font-size:12px;margin:0">' + esc(JSON.stringify(state.view, null, 1)) + "</pre>" + prompt(p) + moves;
    }
  };

  var RENDERERS = { ventures: V, camel_stocks: C, tessera: T };

  function api(path, body) {
    return fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function render() {
    if (!state || !state.started) return;
    var R = RENDERERS[state.game] || G, rec = state.record;
    el("title").textContent = games[state.game] ? games[state.game].label : state.game;
    el("sub").textContent = "vs " + state.agent + " · you are " + (state.seat === 0 ? "first" : "second") + " to play";
    el("record").innerHTML = rec.games ? "Your " + esc(el("title").textContent) + " record: <b>" + rec.wins + "–" + (rec.games - rec.wins - rec.draws) +
      (rec.draws ? "–" + rec.draws : "") + "</b> over " + rec.games + " game" + (rec.games > 1 ? "s" : "") + ", " +
      signed(Math.round(rec.points / rec.games * 10) / 10) + " points per game" : "";
    el("rules").textContent = R.rules;
    el("stage").innerHTML = R.render();
    el("log").innerHTML = state.log.map(function (e) { return '<div class="' + e.who + '">' + esc(e.text) + "</div>"; }).join("");
    el("log").scrollTop = el("log").scrollHeight;
  }

  function act(action) {
    if (busy) return;
    busy = true;
    api("/api/act", { action: action }).then(function (s) { state = s; selected = null; busy = false; render(); });
  }

  el("stage").addEventListener("click", function (e) {
    if (!state || !state.started) return;
    var t = e.target.closest("[data-card],[data-act]");
    if (!t || t.disabled) return;
    if (t.dataset.card !== undefined) { selected = +t.dataset.card; state.error = ""; render(); return; }
    var a = t.dataset.act;
    if (a === "cancel") { selected = null; render(); }
    else if (a === "again") start();
    else act(+a);
  });
  el("stage").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.card !== undefined) { e.preventDefault(); e.target.click(); }
  });

  function fillAgents() {
    var g = games[el("game").value];
    el("agent").innerHTML = (g ? g.agents : []).map(function (a, i) { return '<option value="' + i + '">' + esc(a) + "</option>"; }).join("");
    el("rules").textContent = (RENDERERS[el("game").value] || G).rules;
  }
  function start() {
    selected = null;
    api("/api/new", { game: el("game").value, agent: +el("agent").value, seat: el("seat").value }).then(function (s) { state = s; render(); });
  }
  el("game").addEventListener("change", fillAgents);
  el("new").addEventListener("click", start);

  api("/api/games").then(function (d) {
    games = d.games;
    el("game").innerHTML = Object.keys(games).map(function (k) { return '<option value="' + k + '">' + esc(games[k].label) + "</option>"; }).join("");
    fillAgents();
    return api("/api/state");
  }).then(function (s) {
    state = s;
    if (s.started) { el("game").value = s.game; fillAgents(); }
    render();
  });
})();
</script>
</html>
