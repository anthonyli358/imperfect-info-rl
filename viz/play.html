<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play the Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --ground: #f0f2f6; --surface: #ffffff; --surface-2: #f6f7fa; --ink: #1b2230; --muted: #5c6678;
    --faint: #8b93a4; --line: #e1e5ee; --accent: #4f6aa8; --accent-soft: #e7ecf7;
    --shadow: 0 1px 2px rgba(20, 28, 46, .06), 0 8px 24px rgba(20, 28, 46, .06);
    --pos: #2f7d55; --neg: #b8414c; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f131b; --surface: #191e29; --surface-2: #131822; --ink: #e9edf4; --muted: #97a1b3;
      --faint: #6b7688; --line: #29303d; --accent: #8099c8; --accent-soft: #232c3d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
      --pos: #57b483; --neg: #e06b76; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f131b; --surface: #191e29; --surface-2: #131822; --ink: #e9edf4; --muted: #97a1b3;
    --faint: #6b7688; --line: #29303d; --accent: #8099c8; --accent-soft: #232c3d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    --pos: #57b483; --neg: #e06b76; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 20px; }
  .eyebrow { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  h1 { font-family: "Archivo", sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.02em; line-height: .95; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .spacer { flex: 1; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select { font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; max-width: 100%; }
  .btn { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .record { font-size: 12px; color: var(--muted); }
  .record b { color: var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  .stage { background: radial-gradient(120% 90% at 50% 42%, color-mix(in srgb, var(--accent) 5%, var(--surface)), var(--surface)); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 420px; }

  .panel { border-radius: 12px; padding: 12px 14px; border: 1px solid transparent; }
  .panel.active { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pname { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 15px; }
  .kind { font-size: 11px; color: var(--faint); }
  .pscore { margin-left: auto; font-weight: 700; font-size: 17px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }

  .tableau { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .route { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 5px 5px; display: flex; flex-direction: column; gap: 4px; min-height: 58px; min-width: 0; }
  .route-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .route-name { font-size: 10px; font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .route-score { font-size: 11px; font-weight: 700; }
  .stack { display: flex; flex-direction: column; gap: 3px; }

  .card { --suit: var(--muted); position: relative; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--suit) 32%, var(--line)); background: color-mix(in srgb, var(--suit) 13%, var(--surface)); color: color-mix(in srgb, var(--suit) 72%, var(--ink)); display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; font-weight: 700; box-shadow: inset 3px 0 0 var(--suit); }
  .card.mini { height: 22px; font-size: 12px; padding-left: 3px; }
  .card.hand { height: 52px; min-width: 40px; font-size: 17px; border-radius: 8px; box-shadow: inset 0 3px 0 var(--suit), var(--shadow); flex-direction: column; cursor: pointer; padding: 0 4px; }
  .card.hand .tag { font-family: "Hanken Grotesk", sans-serif; font-weight: 600; font-size: 9px; opacity: .8; }
  .card.hand.playable::after { content: ""; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--pos); }
  .card.hand.selected { outline: 2px solid var(--accent); outline-offset: 2px; transform: translateY(-4px); }
  .card.hand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.hand.inert { cursor: default; }
  .card.back { --suit: var(--faint); background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 5px, var(--surface) 5px, var(--surface) 10px); color: var(--faint); cursor: default; box-shadow: none; }
  .card.known { box-shadow: inset 0 3px 0 var(--suit), 0 0 0 1px var(--suit); }
  .card.good { height: 52px; min-width: 52px; font-family: "Hanken Grotesk", sans-serif; font-size: 12px; font-weight: 700; border-radius: 8px; box-shadow: inset 0 3px 0 var(--suit), var(--shadow); padding: 0 6px; cursor: default; }

  .hand { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: flex-end; }
  .hand-note { font-size: 11px; color: var(--faint); margin-top: 6px; }

  .center { display: flex; align-items: stretch; gap: 10px; padding: 4px; flex-wrap: wrap; }
  .deck { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 14px; border-radius: 10px; border: 1px dashed var(--line); background: var(--surface-2); min-width: 84px; color: var(--ink); }
  .deck .n { font-size: 22px; font-weight: 700; }
  .deck .t { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
  .discards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; flex: 1; }
  .pile { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: inherit; min-width: 0; }
  .pile .slot { width: 100%; min-height: 30px; border-radius: 7px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; }
  .pile .slot .card { width: 100%; }
  .pile .cap { font-size: 9px; color: var(--faint); text-transform: uppercase; }
  .target { cursor: pointer; outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 10px; }
  .target:hover { background: var(--accent-soft); }
  .target:focus-visible { outline-color: var(--accent); }

  /* Camel Stocks: goods cards, coins, market */
  .gcard { --c: var(--muted); position: relative; width: 58px; height: 80px; border-radius: 9px; flex: none;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 88%, #fff), var(--c));
    border: 1px solid color-mix(in srgb, var(--c) 70%, #000); color: #fff; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .gcard .sym { font-size: 24px; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .gcard .nm { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .gcard.known { outline: 2px dashed var(--c); outline-offset: 2px; }
  .gcard.back { --c: #6b7688; background: repeating-linear-gradient(45deg, #5c6678, #5c6678 6px, #6b7688 6px, #6b7688 12px); }
  .gcard.small { width: 44px; height: 60px; } .gcard.small .sym { font-size: 18px; } .gcard.small .nm { font-size: 8px; }
  .coins { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .coin { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700;
    background: color-mix(in srgb, var(--c) 22%, var(--surface)); color: color-mix(in srgb, var(--c) 75%, var(--ink)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); }
  .coin.top { width: 28px; height: 28px; font-size: 13px; background: var(--c); color: #fff; border-color: color-mix(in srgb, var(--c) 70%, #000); }
  .zone { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .zone-title { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; }
  .zone-title b { color: var(--ink); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .herd { display: flex; align-items: center; gap: 6px; }
  .herd .gcard { width: 40px; height: 54px; } .herd .gcard .sym { font-size: 18px; } .herd .gcard .nm { display: none; }
  .herd .n { font-family: "JetBrains Mono", monospace; font-weight: 700; }
  .tokens { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .tpile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px; min-width: 0; }
  .tpile .name { font-size: 10px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tpile .vals { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .tpile .vals b { color: var(--ink); font-size: 13px; }
  .tpile.empty { opacity: .45; }
  .market { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--surface-2); }
  .chip b { color: var(--ink); }
  .moves { display: flex; flex-direction: column; gap: 8px; }
  .move-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .move-group .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); min-width: 70px; }

  .prompt { text-align: center; font-size: 13px; color: var(--muted); min-height: 36px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .prompt b { color: var(--ink); }
  .error { color: var(--neg); font-size: 12px; text-align: center; min-height: 16px; }

  .banner { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .banner .big { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 20px; }

  .log { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; max-height: 620px; }
  .log h2 { font-family: "Archivo", sans-serif; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .log-list { overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .log-list .you { color: var(--ink); } .log-list .opp { color: var(--muted); } .log-list .chance { color: var(--faint); font-style: italic; }
  .log-list .you::before { content: "● "; color: var(--accent); } .log-list .opp::before { content: "○ "; color: var(--faint); }
  .empty { color: var(--muted); text-align: center; padding: 60px 10px; }
  footer { color: var(--faint); font-size: 11px; line-height: 1.5; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .log { max-height: 260px; }
    .tableau, .discards, .tokens { gap: 4px; }
    .tokens { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .route-name { font-size: 8px; }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Human vs agent</p>
      <h1 id="title">Play the agents</h1>
      <div class="sub" id="sub">Pick a game and an opponent, then start.</div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <select id="game" aria-label="Game"></select>
      <select id="agent" aria-label="Opponent"></select>
      <select id="seat" aria-label="Seat">
        <option value="random">Random seat</option>
        <option value="0">You go first</option>
        <option value="1">You go second</option>
      </select>
      <button class="btn primary" id="new">New game</button>
    </div>
  </header>
  <div class="record" id="record"></div>

  <div class="layout">
    <section class="stage" id="stage" aria-label="Game board"><div class="empty">No game yet.</div></section>
    <aside class="log" aria-label="Move log"><h2>Moves</h2><div class="log-list" id="log"></div></aside>
  </div>

  <footer id="rules"></footer>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var games = {}, state = null, selected = null, busy = false;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function signed(v) { return (v > 0 ? "+" : "") + v; }
  function sign(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
  function legalIds() { return (state.legal || []).map(function (a) { return a.id; }); }
  function banner() {
    if (!state.terminal) return "";
    var m = state.margin;
    return '<div class="banner"><span class="big ' + sign(m) + '">' + (m > 0 ? "You win" : m < 0 ? "You lose" : "Draw") +
      '</span><span class="mono">by ' + Math.abs(m) + '</span><button class="btn primary" data-act="again">Play again</button></div>';
  }
  function prompt(text) { return '<div class="prompt">' + text + '</div><div class="error">' + esc(state.error || "") + "</div>"; }

  // ======================= Ventures =======================
  var V = {
    rules: "Each turn: play a card onto one of your routes (ascending, backing cards first) or discard it, then draw from the deck or take the top of a discard pile (not the one you just discarded to). A started route scores (sum − 20) × (1 + backing cards), +20 with 8 or more cards. The game ends when the deck runs out. A green dot marks cards you can play; outlined opponent cards are ones they took from a discard pile.",
    decode: function (meta, id) { var n = meta.ranks.length, r = meta.ranks[id % n]; return { suit: Math.floor(id / n), rank: r, backing: r === meta.ranks[0] }; },
    name: function (meta, id) { var d = V.decode(meta, id); return meta.suit_names[d.suit] + " " + (d.backing ? "backing" : d.rank); },
    card: function (meta, id, cls, attrs) {
      var d = V.decode(meta, id);
      var tag = cls.indexOf("hand") >= 0 ? '<span class="tag">' + esc(meta.suit_names[d.suit].slice(0, 3)) + "</span>" : "";
      return '<div class="card ' + cls + '" style="--suit:' + meta.suit_colors[d.suit] + '" ' + (attrs || "") + ' title="' + esc(V.name(meta, id)) + '">' + (d.backing ? "◆" : d.rank) + tag + "</div>";
    },
    routeScore: function (meta, cards) {
      if (!cards.length) return null;
      var b = 0, s = 0;
      cards.forEach(function (id) { var d = V.decode(meta, id); if (d.backing) b++; else s += d.rank; });
      return (s - meta.start_cost) * (1 + b) + (cards.length >= 8 ? 20 : 0);
    },
    tableau: function (meta, routes) {
      return '<div class="tableau">' + routes.map(function (cards, s) {
        var sc = V.routeScore(meta, cards);
        return '<div class="route"><div class="route-head"><span class="route-name" style="color:' + meta.suit_colors[s] + '">' + esc(meta.suit_names[s]) + "</span>" +
          (sc === null ? "" : '<span class="route-score ' + sign(sc) + '">' + signed(sc) + "</span>") +
          '</div><div class="stack">' + cards.map(function (id) { return V.card(meta, id, "mini"); }).join("") + "</div></div>";
      }).join("") + "</div>";
    },
    render: function () {
      var meta = state.meta, v = state.view, A = meta.actions, me = state.seat, opp = 1 - me;
      var ids = legalIds(), play = [], discard = [], deck = false, take = [];
      ids.forEach(function (a) {
        if (a < A.discard_offset) play.push(a);
        else if (a < A.draw_deck) discard.push(a - A.discard_offset);
        else if (a === A.draw_deck) deck = true;
        else take.push(a - A.take_offset);
      });
      var playPhase = state.your_turn && v.phase === "PLAY", drawPhase = state.your_turn && v.phase === "DRAW";
      var hidden = (v.hidden || [0, 0])[opp];
      var oppCards = v.hands[opp].slice().sort(function (a, b) { return a - b; })
        .map(function (id) { return V.card(meta, id, "hand inert" + (state.terminal ? "" : " known")); }).join("") +
        new Array(hidden + 1).join('<div class="card hand back">?</div>');
      var oppPanel = '<div class="panel' + (!state.terminal && !state.your_turn ? " active" : "") + '"><div class="panel-head"><span class="pname">Opponent</span><span class="kind">' + esc(state.agent) +
        '</span><span class="pscore ' + sign(v.scores[opp]) + '">' + signed(v.scores[opp]) + "</span></div>" + V.tableau(meta, v.routes[opp]) +
        '<div class="hand">' + oppCards + "</div>" + (state.terminal ? '<div class="hand-note">Their hand, revealed.</div>' : "") + "</div>";
      var deckHtml = drawPhase && deck
        ? '<button class="deck target" data-act="' + A.draw_deck + '"><span class="n mono">' + v.deck_size + '</span><span class="t">draw deck</span></button>'
        : '<div class="deck"><span class="n mono">' + v.deck_size + '</span><span class="t">in deck</span></div>';
      var piles = v.discards.map(function (pile, s) {
        var top = pile.length ? V.card(meta, pile[pile.length - 1], "mini") : '<span class="cap">—</span>';
        var can = drawPhase && take.indexOf(s) >= 0;
        return (can ? '<button class="pile target" data-act="' + (A.take_offset + s) + '" aria-label="Take the ' + esc(meta.suit_names[s]) + ' discard">' : '<div class="pile">') +
          '<div class="slot">' + top + '</div><span class="cap">' + esc(meta.suit_names[s].slice(0, 3)) + (pile.length > 1 ? " ·" + pile.length : "") + "</span>" + (can ? "</button>" : "</div>");
      }).join("");
      var p;
      if (state.terminal) p = "";
      else if (!state.your_turn) p = "Opponent is thinking…";
      else if (playPhase && selected === null) p = "<b>Your turn:</b> pick a card from your hand.";
      else if (playPhase) p = "<b>" + esc(V.name(meta, selected)) + "</b>" +
        '<button class="btn primary" data-act="' + selected + '"' + (play.indexOf(selected) >= 0 ? "" : " disabled") + ">Play to route</button>" +
        '<button class="btn" data-act="' + (A.discard_offset + selected) + '">Discard</button><button class="btn" data-act="cancel">Cancel</button>';
      else p = "<b>Draw:</b> click the deck or a highlighted discard pile.";
      var hand = v.hands[me].slice().sort(function (a, b) { return a - b; }).map(function (id) {
        var cls = "hand" + (playPhase && play.indexOf(id) >= 0 ? " playable" : "") + (playPhase && id === selected ? " selected" : "") + (playPhase ? "" : " inert");
        return V.card(meta, id, cls, playPhase ? 'tabindex="0" role="button" data-card="' + id + '"' : "");
      }).join("");
      var you = '<div class="panel' + (state.your_turn ? " active" : "") + '"><div class="panel-head"><span class="pname">You</span><span class="kind">P' + me +
        '</span><span class="pscore ' + sign(v.scores[me]) + '">' + signed(v.scores[me]) + "</span></div>" + V.tableau(meta, v.routes[me]) + '<div class="hand">' + hand + "</div></div>";
      return banner() + oppPanel + '<div class="center">' + deckHtml + '<div class="discards">' + piles + "</div></div>" + prompt(p) + you;
    }
  };

  // ======================= Camel Stocks =======================
  var C = {
    rules: "Each turn, do one thing: take one good from the market (hand limit 7), take all the camels, exchange 2+ goods from the market for as many cards and/or camels (never giving back a good you take), or sell cards of one good (gems, gold, silver: at least 2) for its top tokens, with a bonus for 3, 4 or 5+ cards. The game ends when three token piles are empty or the deck cannot refill the market. The larger herd scores +5. Outlined opponent cards are goods they were seen taking.",
    card: function (meta, id, cls) {
      return '<div class="gcard ' + (cls || "") + '" style="--c:' + meta.card_colors[id] + '" title="' + esc(meta.card_names[id]) + '">' +
        '<span class="sym">' + meta.card_symbols[id] + '</span><span class="nm">' + esc(meta.card_names[id]) + "</span></div>";
    },
    goodOf: function (meta, label) {
      // The good a move label is about (for colouring its button), or -1.
      for (var g = meta.card_names.length - 1; g >= 0; g--) {
        if (label.toLowerCase().indexOf(meta.card_names[g].toLowerCase()) >= 0) return g;
      }
      return /camel/.test(label) ? meta.card_names.length - 1 : -1;
    },
    render: function () {
      var meta = state.meta, v = state.view, me = state.seat, opp = 1 - me;
      var names = meta.card_names, camel = names.length - 1;
      var byGood = function (a, b) { return a - b; };
      var tokens = '<div class="zone"><div class="zone-title">Goods tokens <b>next sale takes the big coin first</b></div><div class="tokens">' +
        v.tokens.map(function (pile, g) {
          var coins = pile.map(function (t, i) { return '<span class="coin' + (i === 0 ? " top" : "") + '">' + t + "</span>"; }).join("");
          return '<div class="tpile' + (pile.length ? "" : " empty") + '" style="--c:' + meta.card_colors[g] + '"><div class="name" style="color:' + meta.card_colors[g] + '">' +
            meta.card_symbols[g] + " " + esc(names[g]) + (meta.precious.indexOf(g) >= 0 ? " ×2+" : "") +
            '</div><div class="coins">' + (coins || '<span class="vals">sold out</span>') + "</div></div>";
        }).join("") + '</div><div class="chips" style="margin-top:8px"><span class="chip">bonus tokens left for 3 / 4 / 5+ cards: <b>' + v.bonus_left.join(" / ") +
        '</b></span><span class="chip">larger herd: <b>+5</b></span></div></div>';
      var market = '<div class="zone"><div class="zone-title">Market <b>' + v.deck_size + " cards left in the deck</b></div>" +
        '<div class="row">' + v.market.slice().sort(byGood).map(function (c) { return C.card(meta, c); }).join("") + "</div></div>";
      function panel(p, who) {
        var hidden = (v.hidden || [0, 0])[p];
        var cards = v.hands[p].slice().sort(byGood).map(function (c) { return C.card(meta, c, p === opp && !state.terminal ? "known" : ""); }).join("") +
          new Array(hidden + 1).join('<div class="gcard back"><span class="sym">?</span></div>');
        var size = v.hands[p].length + hidden;
        var active = !state.terminal && (p === me ? state.your_turn : !state.your_turn);
        var herd = '<div class="herd">' + C.card(meta, camel, "small") + '<span class="n">× ' + v.herds[p] + "</span></div>";
        return '<div class="panel' + (active ? " active" : "") + '"><div class="panel-head"><span class="pname">' + who + "</span>" +
          '<span class="kind">' + (p === opp ? esc(state.agent) : "P" + me) + '</span><span class="chip">hand <b>' + size + "/" + meta.hand_limit + "</b></span>" +
          '<span class="pscore">' + v.scores[p] + ' <span class="kind">pts</span></span></div>' +
          '<div class="row" style="justify-content:space-between;align-items:flex-end"><div class="hand" style="margin-top:0">' + cards + "</div>" + herd + "</div></div>";
      }
      var exch = (v.taken && v.taken.length) || (v.given && v.given.length)
        ? '<div class="zone"><div class="zone-title">Exchange in progress</div><div class="row"><span class="kind">taking</span>' +
          v.taken.map(function (c) { return C.card(meta, c, "small"); }).join("") + '<span class="kind" style="margin-left:12px">giving</span>' +
          (v.given.map(function (c) { return C.card(meta, c, "small"); }).join("") || '<span class="kind">—</span>') + "</div></div>" : "";
      var moves = "";
      if (state.your_turn) {
        var groups = {};
        state.legal.forEach(function (a) {
          var key = /^exchange/.test(a.label) ? "Exchange" : /^sell/.test(a.label) ? "Sell" : "Take";
          (groups[key] = groups[key] || []).push(a);
        });
        moves = '<div class="moves">' + ["Take", "Sell", "Exchange"].filter(function (k) { return groups[k]; }).map(function (k) {
          return '<div class="move-group"><span class="glabel">' + k + "</span>" + groups[k].map(function (a) {
            var g = C.goodOf(meta, a.label);
            var style = g >= 0 ? ' style="box-shadow: inset 4px 0 0 ' + meta.card_colors[g] + '"' : "";
            return '<button class="btn" data-act="' + a.id + '"' + style + ">" + (g >= 0 ? meta.card_symbols[g] + " " : "") +
              esc(a.label.replace(/^exchange: /, "")) + "</button>";
          }).join("") + "</div>";
        }).join("") + "</div>";
      }
      var p = state.terminal ? "" : state.your_turn ? "<b>Your turn:</b> choose a move below." : "Opponent is thinking…";
      return banner() + panel(opp, "Opponent") + tokens + market + exch + prompt(p) + moves + panel(me, "You");
    }
  };

  // ======================= Any other game: the raw view and the legal moves =======================
  var G = {
    rules: "No board for this game yet: the panel shows your view of the position, and every legal move is a button.",
    render: function () {
      var moves = state.your_turn ? '<div class="move-group">' + state.legal.map(function (a) {
        return '<button class="btn" data-act="' + a.id + '">' + esc(a.label) + "</button>";
      }).join("") + "</div>" : "";
      var p = state.terminal ? "" : state.your_turn ? "<b>Your turn:</b> choose a move." : "Opponent is thinking…";
      return banner() + '<pre class="mono" style="white-space:pre-wrap;font-size:12px;margin:0">' + esc(JSON.stringify(state.view, null, 1)) + "</pre>" + prompt(p) + moves;
    }
  };

  var RENDERERS = { ventures: V, camel_stocks: C };

  function api(path, body) {
    return fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function render() {
    if (!state || !state.started) return;
    var R = RENDERERS[state.game] || G, rec = state.record;
    el("title").textContent = games[state.game] ? games[state.game].label : state.game;
    el("sub").textContent = "vs " + state.agent + " · you are " + (state.seat === 0 ? "first" : "second") + " to play";
    el("record").innerHTML = rec.games ? "Your " + esc(el("title").textContent) + " record: <b>" + rec.wins + "–" + (rec.games - rec.wins - rec.draws) +
      (rec.draws ? "–" + rec.draws : "") + "</b> over " + rec.games + " game" + (rec.games > 1 ? "s" : "") + ", " +
      signed(Math.round(rec.points / rec.games * 10) / 10) + " points per game" : "";
    el("rules").textContent = R.rules;
    el("stage").innerHTML = R.render();
    el("log").innerHTML = state.log.map(function (e) { return '<div class="' + e.who + '">' + esc(e.text) + "</div>"; }).join("");
    el("log").scrollTop = el("log").scrollHeight;
  }

  function act(action) {
    if (busy) return;
    busy = true;
    api("/api/act", { action: action }).then(function (s) { state = s; selected = null; busy = false; render(); });
  }

  el("stage").addEventListener("click", function (e) {
    if (!state || !state.started) return;
    var t = e.target.closest("[data-card],[data-act]");
    if (!t || t.disabled) return;
    if (t.dataset.card !== undefined) { selected = +t.dataset.card; state.error = ""; render(); return; }
    var a = t.dataset.act;
    if (a === "cancel") { selected = null; render(); }
    else if (a === "again") start();
    else act(+a);
  });
  el("stage").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.card !== undefined) { e.preventDefault(); e.target.click(); }
  });

  function fillAgents() {
    var g = games[el("game").value];
    el("agent").innerHTML = (g ? g.agents : []).map(function (a, i) { return '<option value="' + i + '">' + esc(a) + "</option>"; }).join("");
    el("rules").textContent = (RENDERERS[el("game").value] || G).rules;
  }
  function start() {
    selected = null;
    api("/api/new", { game: el("game").value, agent: +el("agent").value, seat: el("seat").value }).then(function (s) { state = s; render(); });
  }
  el("game").addEventListener("change", fillAgents);
  el("new").addEventListener("click", start);

  api("/api/games").then(function (d) {
    games = d.games;
    el("game").innerHTML = Object.keys(games).map(function (k) { return '<option value="' + k + '">' + esc(games[k].label) + "</option>"; }).join("");
    fillAgents();
    return api("/api/state");
  }).then(function (s) {
    state = s;
    if (s.started) { el("game").value = s.game; fillAgents(); }
    render();
  });
})();
</script>
</html>
